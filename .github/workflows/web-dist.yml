name: Build web and publish to web-dist

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/web-dist.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build static site
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://groundwork-api-nu.vercel.app/api' }}
        run: |
          npm ci
          npm run build
          cp out/index.html out/200.html 2>/dev/null || true
      - name: Publish to web-dist
        run: |
          # Add a commit on top of the existing web-dist branch (never rewrite it), so a server that pulls it can fast-forward.
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if ! git clone -q --depth 1 --branch web-dist "$REPO" /tmp/dist 2>/dev/null; then
            git init -q -b web-dist /tmp/dist
            git -C /tmp/dist remote add origin "$REPO"
          fi
          cd /tmp/dist
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/apps/web/out/." .
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push origin web-dist
