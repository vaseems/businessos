name: market-ingest

# End-of-day Markets data → Supabase. India runs after NSE publishes its closing files; the US after the NYSE close.
# One-time setup: add the repository secret MARKET_INGEST_TOKEN (Settings → Secrets and variables → Actions).
on:
  push:
    branches: [market-backfill]   # push this branch to run the one-off history backfill
  schedule:
    - cron: '30 13 * * 1-5'   # 19:00 IST, after NSE closing files are out
    - cron: '30 2 * * 2-6'    # 08:00 IST next morning — self-heal if the evening run missed a file
    - cron: '30 22 * * 1-5'   # 17:30 EST / 18:30 EDT, ~1.5 h after the US close
    - cron: '0 11 * * 2-6'    # 06:00 EST / 07:00 EDT next morning — US self-heal
  workflow_dispatch:
    inputs:
      region:
        description: 'Region: in, us, or both'
        default: 'both'
      days:
        description: 'Calendar days of sessions to (re)load — 8 daily, ~380 for first backfill'
        default: '8'
      stock_days:
        description: 'Calendar days of stock history (tracked symbols) — ~190 for first backfill'
        default: '8'
      dry:
        description: 'Dry run (fetch + validate, write nothing)'
        type: boolean
        default: false

concurrency:
  group: market-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: https://uzyaqriglnewolxiadhs.supabase.co
      # publishable (public-by-design) key; the write RPC additionally requires MARKET_INGEST_TOKEN
      SUPABASE_KEY: sb_publishable_QRxslBW8zXJmth8nleuJfA_tpUkAApW
      MARKET_INGEST_TOKEN: ${{ secrets.MARKET_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Ingest
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_REGION: ${{ github.event.inputs.region }}
          IN_DAYS: ${{ github.event.inputs.days }}
          IN_SDAYS: ${{ github.event.inputs.stock_days }}
          IN_DRY: ${{ github.event.inputs.dry }}
        run: |
          DAYS="${IN_DAYS:-8}"; SDAYS="${IN_SDAYS:-8}"
          if [ "$EVENT" = "push" ]; then DAYS=380; SDAYS=190; fi
          case "$EVENT" in
            schedule) case "$SCHEDULE" in '30 22 * * 1-5'|'0 11 * * 2-6') REGIONS="us";; *) REGIONS="in";; esac ;;
            *) case "${IN_REGION:-both}" in in) REGIONS="in";; us) REGIONS="us";; *) REGIONS="in us";; esac ;;
          esac
          DRY=""; if [ "$IN_DRY" = "true" ]; then DRY="--dry"; fi
          FAIL=0
          for R in $REGIONS; do
            echo "::group::region $R"
            node scripts/market/ingest.mjs --region "$R" --days "$DAYS" --stock-days "$SDAYS" $DRY || FAIL=1
            echo "::endgroup::"
          done
          exit $FAIL
